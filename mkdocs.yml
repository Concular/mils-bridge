# The public documentation site: https://concular.github.io/mils-bridge/
#
# Built from docs/ and spec/ by .github/workflows/docs.yml on every push to
# main. The pages under docs/ are generated by the source repository's sync
# script (each says so at the top) — edit them there. This file, docs/index.md,
# docs/api-reference.md and docs-site/ are authored here.
#
#   pip install -r docs-site/requirements.txt
#   mkdocs serve            # http://127.0.0.1:8000/mils-bridge/
#   mkdocs build --strict   # what CI runs

site_name: MILS Bridge
site_description: >-
  Register what your organisation already has as items in MILS, keep the
  cross-reference, and serve those items back to the peer nodes that ask.
site_url: https://concular.github.io/mils-bridge/
repo_url: https://github.com/Concular/mils-bridge
repo_name: Concular/mils-bridge
# The pages are generated from a private repository; an "edit" button here
# would open a file whose next sync overwrites the change.
edit_uri: ''
copyright: MILS Bridge documentation

docs_dir: docs
site_dir: site

hooks:
  - docs-site/hooks.py

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Understand:
      - What this is: what-this-is.md
      - Glossary: glossary.md
  - Run a node:
      - Deployment: deployment.md
      - Configuration: configuration.md
      - Security: security.md
      - Runbooks: runbooks.md
      - Troubleshooting: troubleshooting.md
  - Access and peers:
      - Access control: access-control.md
      - Actors and nodes: actors-and-nodes.md
      - Peer node quickstart: peer-node-quickstart.md
      - Peer node onboarding: peer-node-onboarding.md
  - Reference:
      - The /rest API (mils-internal): mils-internal-api.md
      - OpenAPI contract: api-reference.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true
      # The pages are written for GitHub, whose heading anchors keep every
      # hyphen (`why-it-is-unauthenticated--and-how-to-change-that`). This
      # slugifier produces the same ids, so the cross-page anchors resolve.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search

# Every broken link or anchor fails `mkdocs build --strict`.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
