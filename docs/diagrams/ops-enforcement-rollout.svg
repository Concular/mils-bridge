<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ops-enforcement-rollout-title ops-enforcement-rollout-desc">
      <title id="ops-enforcement-rollout-title">Rolling out access enforcement</title>
      <desc id="ops-enforcement-rollout-desc">Flowchart of the shadow-to-enforce rollout: deploy with ACCESS_ENFORCEMENT=shadow, sync and enable the nodes, configure the access rules, watch the recorded denials, and only when they match expectations switch the variable to enforce so blocked nodes receive 403.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2736c8"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#009634"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f7ff"/>

      <!-- arrows (before nodes) -->
      <line x1="320" y1="96" x2="320" y2="136" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="192" x2="320" y2="232" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="288" x2="320" y2="328" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="384" x2="320" y2="412" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- YES: diamond bottom -> switch -->
      <line x1="320" y1="492" x2="320" y2="524" stroke="#2736c8" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="328" y="500" width="28" height="12" rx="2" fill="#f7f7ff"/>
      <text x="342" y="509" fill="#999999" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <!-- NO: diamond right -> adjust -->
      <line x1="440" y1="452" x2="560" y2="452" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="488" y="432" width="24" height="12" rx="2" fill="#f7f7ff"/>
      <text x="500" y="441" fill="#999999" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <!-- adjust -> back to configure -->
      <path d="M660,424 V268 Q660,260 652,260 H440" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="668" y="340" width="52" height="12" rx="2" fill="#f7f7ff"/>
      <text x="694" y="349" fill="#999999" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RE-CHECK</text>
      <!-- switch -> end -->
      <line x1="320" y1="580" x2="320" y2="612" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- nodes -->
      <!-- start -->
      <rect x="200" y="48" width="240" height="48" rx="20" fill="#f7f7ff"/>
      <rect x="200" y="48" width="240" height="48" rx="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="320" y="68" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Deploy</text>
      <text x="320" y="84" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ACCESS_ENFORCEMENT=shadow (default)</text>

      <!-- step: sync -->
      <rect x="200" y="136" width="240" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="200" y="136" width="240" height="56" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="320" y="160" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Sync the actor registry</text>
      <text x="320" y="176" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sync:actor-registry · enable each node</text>

      <!-- step: configure -->
      <rect x="200" y="232" width="240" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="200" y="232" width="240" height="56" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="320" y="256" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Configure access</text>
      <text x="320" y="272" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">policy · node defaults · element rules</text>

      <!-- step: watch -->
      <rect x="200" y="328" width="240" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="200" y="328" width="240" height="56" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="320" y="352" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Watch the shadow numbers</text>
      <text x="320" y="368" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dashboard denied7d · [shadow] log lines</text>

      <!-- decision -->
      <polygon points="320,412 440,452 320,492 200,452" fill="#f7f7ff"/>
      <polygon points="320,412 440,452 320,492 200,452" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="320" y="448" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Denials as expected?</text>
      <text x="320" y="464" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run it for days, not minutes</text>

      <!-- step: adjust -->
      <rect x="560" y="424" width="200" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="560" y="424" width="200" height="56" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="660" y="448" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Adjust the rules</text>
      <text x="660" y="464" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Access → Elements / Nodes</text>

      <!-- step: switch (focal) -->
      <rect x="200" y="524" width="240" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="200" y="524" width="240" height="56" rx="6" fill="rgba(39,54,200,0.08)" stroke="#2736c8" stroke-width="1.2"/>
      <text x="320" y="548" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Switch to enforce</text>
      <text x="320" y="564" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ACCESS_ENFORCEMENT=enforce · restart the BFF</text>

      <!-- end -->
      <rect x="200" y="612" width="240" height="48" rx="20" fill="#f7f7ff"/>
      <rect x="200" y="612" width="240" height="48" rx="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="320" y="632" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Blocked nodes get 403</text>
      <text x="320" y="648" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Policy tab shows the mode</text>

      <!-- legend -->
      <line x1="40" y1="688" x2="960" y2="688" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
      <text x="40" y="712" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="704" width="20" height="12" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="148" y="713" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">START / END</text>
      <rect x="248" y="704" width="16" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="272" y="713" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">STEP</text>
      <polygon points="336,704 344,710 336,716 328,710" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="352" y="713" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">DECISION</text>
      <rect x="432" y="704" width="16" height="12" rx="2" fill="rgba(39,54,200,0.08)" stroke="#2736c8" stroke-width="1"/>
      <text x="456" y="713" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">THE ONE STEP THAT CHANGES LIVE BEHAVIOUR</text>
      <line x1="740" y1="708" x2="768" y2="708" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="780" y="713" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">LOOP BACK</text>
    </svg>
