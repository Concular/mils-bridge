<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apix-target-guard-title apix-target-guard-desc">
      <title id="apix-target-guard-title">API Explorer — the target guard</title>
      <desc id="apix-target-guard-desc">Flowchart of the URL policy applied to every proxied request: the target must be an absolute http or https URL without embedded credentials, must sit under the API base URL, and must not resolve to a private or loopback address unless private targets are allowed; only then is it forwarded with the stored credential.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2736c8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f7ff"/>

      <!-- arrows -->
      <line x1="400" y1="80" x2="400" y2="104" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="508" y1="152" x2="640" y2="152" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="200" x2="400" y2="232" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="508" y1="280" x2="640" y2="280" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="328" x2="400" y2="360" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="508" y1="408" x2="640" y2="408" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="456" x2="400" y2="480" stroke="#2736c8" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- arrow labels -->
      <rect x="556" y="132" width="24" height="12" rx="2" fill="#f7f7ff"/>
      <text x="568" y="141" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
      <rect x="412" y="210" width="32" height="12" rx="2" fill="#f7f7ff"/>
      <text x="428" y="219" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
      <rect x="556" y="260" width="24" height="12" rx="2" fill="#f7f7ff"/>
      <text x="568" y="269" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
      <rect x="412" y="338" width="32" height="12" rx="2" fill="#f7f7ff"/>
      <text x="428" y="347" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
      <rect x="556" y="388" width="32" height="12" rx="2" fill="#f7f7ff"/>
      <text x="572" y="397" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
      <rect x="412" y="462" width="24" height="12" rx="2" fill="#f7f7ff"/>
      <text x="424" y="471" fill="#2736c8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <!-- start -->
      <rect x="320" y="32" width="160" height="48" rx="24" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <text x="400" y="52" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Proxied target</text>
      <text x="400" y="68" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">?scalar_url=&lt;absolute URL&gt;</text>

      <!-- decisions -->
      <polygon points="400,104 508,152 400,200 292,152" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="400" y="148" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Absolute http(s),</text>
      <text x="400" y="164" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">no user:pass?</text>

      <polygon points="400,232 508,280 400,328 292,280" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="400" y="276" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Under the API</text>
      <text x="400" y="292" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">base URL?</text>

      <polygon points="400,360 508,408 400,456 292,408" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="400" y="404" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Private or loopback</text>
      <text x="400" y="420" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">host, and blocked?</text>

      <!-- ends -->
      <rect x="640" y="128" width="224" height="48" rx="24" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <text x="752" y="148" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">400 Bad Request</text>
      <text x="752" y="164" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parseHttpUrl</text>

      <rect x="640" y="256" width="224" height="48" rx="24" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <text x="752" y="276" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">403 Forbidden</text>
      <text x="752" y="292" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">not under this API base URL</text>

      <rect x="640" y="384" width="224" height="48" rx="24" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <text x="752" y="404" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">403 Forbidden</text>
      <text x="752" y="420" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ALLOW_PRIVATE_TARGETS unset</text>

      <rect x="304" y="480" width="192" height="48" rx="24" fill="rgba(39,54,200,0.08)" stroke="#2736c8" stroke-width="1.2"/>
      <text x="400" y="500" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Forward with credential</text>
      <text x="400" y="516" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DNS-resolved check · no redirects</text>

      <!-- legend -->
      <line x1="40" y1="544" x2="920" y2="544" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
      <text x="40" y="560" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
      <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <text x="72" y="582" fill="#666666" font-size="8" font-family="'Inter', sans-serif">Start / refusal</text>
      <polygon points="220,578 232,572 244,578 232,584" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="256" y="582" fill="#666666" font-size="8" font-family="'Inter', sans-serif">Check (TargetGuard)</text>
      <rect x="400" y="572" width="24" height="12" rx="6" fill="rgba(39,54,200,0.08)" stroke="#2736c8" stroke-width="1"/>
      <text x="432" y="582" fill="#666666" font-size="8" font-family="'Inter', sans-serif">The only path that reaches the upstream</text>
    </svg>
