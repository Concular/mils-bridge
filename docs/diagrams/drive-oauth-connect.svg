<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="drive-oauth-connect-title drive-oauth-connect-desc">
      <title id="drive-oauth-connect-title">Google Drive — connecting a console user</title>
      <desc id="drive-oauth-connect-desc">Sequence diagram of the Google OAuth connect flow: the console asks the BFF for a consent URL, the browser visits Google, Google redirects to the BFF callback with a code and a single-use state, the BFF exchanges the code and stores the tokens, then either redirects back into the console or renders a close-this-tab page for the desktop app.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2736c8"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#009634"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f7ff"/>

      <!-- lifelines: Console 160 · BFF 480 · Google 800 -->
      <line x1="160" y1="128" x2="160" y2="640" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="128" x2="480" y2="640" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="640" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- activation bars -->
      <rect x="476" y="172" width="8" height="48" fill="rgba(0,0,0,0.06)" stroke="#666666" stroke-width="0.8"/>
      <rect x="476" y="308" width="8" height="140" fill="rgba(0,0,0,0.06)" stroke="#666666" stroke-width="0.8"/>
      <rect x="796" y="356" width="8" height="48" fill="rgba(0,0,0,0.06)" stroke="#666666" stroke-width="0.8"/>

      <!-- M1 Console → BFF -->
      <line x1="160" y1="176" x2="476" y2="176" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="240" y="160" width="152" height="12" rx="2" fill="#f7f7ff"/>
      <text x="316" y="170" fill="#009634" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST CONNECT {RETURNTO}</text>

      <!-- M2 BFF → Console return -->
      <line x1="476" y1="216" x2="168" y2="216" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="232" y="200" width="168" height="12" rx="2" fill="#f7f7ff"/>
      <text x="316" y="210" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">{AUTHURL} · STATE ROW, 10 MIN</text>

      <!-- M3 Console → Google (top-level navigation) -->
      <line x1="160" y1="264" x2="796" y2="264" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="400" y="248" width="160" height="12" rx="2" fill="#f7f7ff"/>
      <text x="480" y="258" fill="#009634" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NAVIGATE TO CONSENT SCREEN</text>

      <!-- M4 Google → BFF callback -->
      <line x1="800" y1="312" x2="484" y2="312" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="548" y="296" width="184" height="12" rx="2" fill="#f7f7ff"/>
      <text x="640" y="306" fill="#009634" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">302 → OAUTH/CALLBACK ?CODE&amp;STATE</text>

      <!-- M5 BFF → Google token exchange -->
      <line x1="484" y1="360" x2="796" y2="360" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="576" y="344" width="128" height="12" rx="2" fill="#f7f7ff"/>
      <text x="640" y="354" fill="#009634" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXCHANGE CODE</text>

      <!-- M6 Google → BFF tokens -->
      <line x1="796" y1="400" x2="488" y2="400" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="560" y="384" width="160" height="12" rx="2" fill="#f7f7ff"/>
      <text x="640" y="394" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFRESH + ACCESS TOKEN, EMAIL</text>

      <!-- self: upsert GoogleAccount -->
      <path d="M484,424 H508 Q516,424 516,432 V436 Q516,444 508,444 H492" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="428" width="152" height="12" rx="2" fill="#f7f7ff"/>
      <text x="604" y="437" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONSUME STATE · UPSERT ACCOUNT</text>

      <!-- ALT frame: completion -->
      <rect x="88" y="472" width="520" height="168" rx="4" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.22)" stroke-width="1"/>
      <rect x="88" y="472" width="40" height="16" rx="2" fill="#f7f7ff" stroke="rgba(0,0,0,0.22)" stroke-width="1"/>
      <text x="108" y="484" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="100" y="508" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[completion = redirect · web]</text>

      <!-- M7 BFF → Console redirect (headline) -->
      <line x1="476" y1="536" x2="168" y2="536" stroke="#2736c8" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="224" y="520" width="184" height="12" rx="2" fill="#f7f7ff"/>
      <text x="316" y="530" fill="#2736c8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">302 WEB_ORIGIN?GOOGLE=CONNECTED</text>

      <line x1="96" y1="560" x2="600" y2="560" stroke="rgba(0,0,0,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="100" y="584" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[completion = page · desktop, system browser]</text>

      <!-- M8 BFF → browser page -->
      <line x1="476" y1="616" x2="168" y2="616" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="240" y="600" width="152" height="12" rx="2" fill="#f7f7ff"/>
      <text x="316" y="610" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 HTML · CLOSE THIS TAB</text>

      <!-- actors -->
      <rect x="88" y="72" width="144" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="88" y="72" width="144" height="56" rx="6" fill="rgba(102,102,102,0.10)" stroke="#999999" stroke-width="1"/>
      <rect x="96" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(153,153,153,0.40)" stroke-width="0.8"/>
      <text x="112" y="89" fill="#999999" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="160" y="104" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Console</text>
      <text x="160" y="119" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser · session cookie</text>

      <rect x="408" y="72" width="144" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="408" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <rect x="416" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.40)" stroke-width="0.8"/>
      <text x="430" y="89" fill="rgba(0,0,0,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BFF</text>
      <text x="480" y="104" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Google Drive module</text>
      <text x="480" y="119" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/integration/google-drive</text>

      <rect x="728" y="72" width="144" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <rect x="736" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.30)" stroke-width="0.8"/>
      <text x="750" y="89" fill="rgba(0,0,0,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="800" y="104" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Google</text>
      <text x="800" y="119" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OAuth 2.0 · offline access</text>

      <!-- legend -->
      <line x1="56" y1="664" x2="904" y2="664" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
      <text x="56" y="680" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <line x1="140" y1="700" x2="168" y2="700" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="176" y="704" fill="#666666" font-size="8" font-family="'Inter', sans-serif">HTTP call / navigation</text>
      <line x1="320" y1="700" x2="348" y2="700" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="356" y="704" fill="#666666" font-size="8" font-family="'Inter', sans-serif">Return</text>
      <line x1="428" y1="700" x2="456" y2="700" stroke="#2736c8" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="464" y="704" fill="#666666" font-size="8" font-family="'Inter', sans-serif">Headline success</text>
      <rect x="580" y="692" width="28" height="16" rx="2" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.22)" stroke-width="1"/>
      <text x="588" y="704" fill="#666666" font-size="7" font-family="'Geist Mono', monospace">ALT</text>
      <text x="616" y="704" fill="#666666" font-size="8" font-family="'Inter', sans-serif">Branch on completion mode</text>
    </svg>
