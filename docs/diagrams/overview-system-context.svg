<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-system-context-title overview-system-context-desc">
      <title id="overview-system-context-title">MILS Node — system context</title>
      <desc id="overview-system-context-desc">Context diagram showing the console and external actor nodes calling only the NestJS BFF, which keeps its state in SQLite plus a local file store and reaches MILS, Concore, Google Drive and user-imported APIs server-to-server with credentials the browser never sees.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2736c8"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#009634"/></marker>
      </defs>

      <!-- paper -->
      <rect width="100%" height="100%" fill="#f7f7ff"/>

      <!-- ── zone: upstreams (painted first) ─────────────────────────── -->
      <rect x="696" y="44" width="248" height="404" rx="8" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
      <rect x="712" y="48" width="200" height="12" rx="2" fill="#f7f7ff"/>
      <text x="812" y="57" fill="rgba(0,0,0,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">UPSTREAMS · SERVER-TO-SERVER</text>

      <!-- ── arrows (before nodes) ───────────────────────────────────── -->
      <!-- Console → BFF -->
      <line x1="200" y1="168" x2="320" y2="168" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="218" y="148" width="84" height="12" rx="2" fill="#f7f7ff"/>
      <text x="260" y="157" fill="#999999" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSION COOKIE</text>

      <!-- Nodes (actors) → BFF, actor API -->
      <path d="M200,360 H256 Q264,360 264,352 V208 Q264,200 272,200 H320" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="200" y="276" width="56" height="12" rx="2" fill="#f7f7ff"/>
      <text x="228" y="285" fill="#999999" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACTOR JWT</text>

      <!-- Nodes (actors) → BFF, mils-internal (unauthenticated) -->
      <path d="M200,392 H280 Q288,392 288,384 V232 Q288,224 296,224 H320" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="296" y="300" width="48" height="12" rx="2" fill="#f7f7ff"/>
      <text x="320" y="309" fill="#999999" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO AUTH</text>

      <!-- BFF → store -->
      <line x1="440" y1="232" x2="440" y2="328" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="448" y="272" width="44" height="12" rx="2" fill="#f7f7ff"/>
      <text x="470" y="281" fill="#999999" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRISMA</text>

      <!-- BFF → MILS -->
      <path d="M560,140 H632 Q640,140 640,132 V116 Q640,108 648,108 H720" fill="none" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="652" y="88" width="64" height="12" rx="2" fill="#f7f7ff"/>
      <text x="684" y="97" fill="#999999" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MINTED JWT</text>

      <!-- BFF → Concore -->
      <path d="M560,164 H632 Q640,164 640,172 V196 Q640,204 648,204 H720" fill="none" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="656" y="184" width="56" height="12" rx="2" fill="#f7f7ff"/>
      <text x="684" y="193" fill="#999999" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">X-API-KEY</text>

      <!-- BFF → Google Drive -->
      <path d="M560,188 H608 Q616,188 616,196 V292 Q616,300 624,300 H720" fill="none" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="640" y="280" width="68" height="12" rx="2" fill="#f7f7ff"/>
      <text x="674" y="289" fill="#999999" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OAUTH TOKEN</text>

      <!-- BFF → imported APIs -->
      <path d="M560,212 H584 Q592,212 592,220 V388 Q592,396 600,396 H720" fill="none" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="624" y="376" width="72" height="12" rx="2" fill="#f7f7ff"/>
      <text x="660" y="385" fill="#999999" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STORED CRED</text>

      <!-- ── nodes ───────────────────────────────────────────────────── -->
      <!-- Console (input) -->
      <rect x="40" y="120" width="160" height="96" rx="6" fill="#f7f7ff"/>
      <rect x="40" y="120" width="160" height="96" rx="6" fill="rgba(102,102,102,0.10)" stroke="#999999" stroke-width="1"/>
      <rect x="48" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(153,153,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="137" fill="rgba(153,153,153,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="120" y="170" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Console</text>
      <text x="120" y="186" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser · desktop window</text>

      <!-- Nodes / actors (external systems) -->
      <rect x="40" y="328" width="160" height="96" rx="6" fill="#f7f7ff"/>
      <rect x="40" y="328" width="160" height="96" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <rect x="48" y="336" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.30)" stroke-width="0.8"/>
      <text x="62" y="345" fill="rgba(0,0,0,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="120" y="378" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Nodes (actors)</text>
      <text x="120" y="394" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">systems reading elements</text>

      <!-- BFF (focal) -->
      <rect x="320" y="120" width="240" height="112" rx="6" fill="#f7f7ff"/>
      <rect x="320" y="120" width="240" height="112" rx="6" fill="rgba(39,54,200,0.08)" stroke="#2736c8" stroke-width="1.2"/>
      <rect x="328" y="128" width="40" height="12" rx="2" fill="transparent" stroke="rgba(39,54,200,0.40)" stroke-width="0.8"/>
      <text x="348" y="137" fill="rgba(39,54,200,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NESTJS</text>
      <text x="440" y="176" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">BFF</text>
      <text x="440" y="192" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api · proxy · mapping · registration</text>

      <!-- Store -->
      <rect x="320" y="328" width="240" height="64" rx="6" fill="#f7f7ff"/>
      <rect x="320" y="328" width="240" height="64" rx="6" fill="rgba(0,0,0,0.05)" stroke="#666666" stroke-width="1"/>
      <rect x="328" y="336" width="32" height="12" rx="2" fill="transparent" stroke="rgba(102,102,102,0.40)" stroke-width="0.8"/>
      <text x="344" y="345" fill="rgba(102,102,102,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
      <text x="440" y="362" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">SQLite + file store</text>
      <text x="440" y="378" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mapping.db · FILE_STORE_DIR</text>

      <!-- MILS (target) -->
      <rect x="720" y="76" width="200" height="64" rx="6" fill="#f7f7ff"/>
      <rect x="720" y="76" width="200" height="64" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <rect x="728" y="84" width="44" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.30)" stroke-width="0.8"/>
      <text x="750" y="93" fill="rgba(0,0,0,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TARGET</text>
      <text x="820" y="110" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MILS</text>
      <text x="820" y="126" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/rest · metadata tracker</text>

      <!-- Concore (source) -->
      <rect x="720" y="172" width="200" height="64" rx="6" fill="#f7f7ff"/>
      <rect x="720" y="172" width="200" height="64" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <rect x="728" y="180" width="44" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.30)" stroke-width="0.8"/>
      <text x="750" y="189" fill="rgba(0,0,0,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
      <text x="820" y="206" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Concore</text>
      <text x="820" y="222" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/v2 · one organisation</text>

      <!-- Google Drive (source) -->
      <rect x="720" y="268" width="200" height="64" rx="6" fill="#f7f7ff"/>
      <rect x="720" y="268" width="200" height="64" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <rect x="728" y="276" width="44" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.30)" stroke-width="0.8"/>
      <text x="750" y="285" fill="rgba(0,0,0,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
      <text x="820" y="302" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Google Drive</text>
      <text x="820" y="318" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per-user OAuth account</text>

      <!-- Imported APIs (source) -->
      <rect x="720" y="364" width="200" height="64" rx="6" fill="#f7f7ff"/>
      <rect x="720" y="364" width="200" height="64" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <rect x="728" y="372" width="44" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.30)" stroke-width="0.8"/>
      <text x="750" y="381" fill="rgba(0,0,0,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
      <text x="820" y="398" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Imported APIs</text>
      <text x="820" y="414" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenAPI · API Explorer proxy</text>

      <!-- ── legend strip ────────────────────────────────────────────── -->
      <line x1="40" y1="488" x2="960" y2="488" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
      <text x="40" y="512" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="504" width="12" height="12" rx="2" fill="rgba(39,54,200,0.08)" stroke="#2736c8" stroke-width="1"/>
      <text x="140" y="513" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">THE ONLY ENTRY POINT</text>

      <rect x="284" y="504" width="12" height="12" rx="2" fill="rgba(102,102,102,0.10)" stroke="#999999" stroke-width="1"/>
      <text x="304" y="513" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">BROWSER</text>

      <rect x="376" y="504" width="12" height="12" rx="2" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <text x="396" y="513" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">EXTERNAL SYSTEM</text>

      <rect x="512" y="504" width="12" height="12" rx="2" fill="rgba(0,0,0,0.05)" stroke="#666666" stroke-width="1"/>
      <text x="532" y="513" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">LOCAL STATE</text>

      <line x1="624" y1="508" x2="652" y2="508" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="664" y="513" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">S2S · BFF CREDENTIAL</text>

      <line x1="804" y1="508" x2="832" y2="508" stroke="#666666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="844" y="513" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">UNAUTHENTICATED</text>
    </svg>
