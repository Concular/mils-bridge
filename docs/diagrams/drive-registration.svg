<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="drive-registration-title drive-registration-desc">
      <title id="drive-registration-title">Google Drive — registering a file into MILS</title>
      <desc id="drive-registration-desc">Sequence diagram of a Drive registration: the BFF writes a PENDING mapping, reads the file metadata, streams the bytes from Drive into the local content-addressed store, creates the MILS item, then marks the mapping REGISTERED and writes the payload and log before answering the console.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2736c8"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#009634"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f7ff"/>

      <!-- lifelines: Console 120 · BFF 320 · Drive 520 · Store 720 · MILS 920 -->
      <line x1="120" y1="128" x2="120" y2="624" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="320" y1="128" x2="320" y2="624" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="520" y1="128" x2="520" y2="624" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="720" y1="128" x2="720" y2="624" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="920" y1="128" x2="920" y2="624" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- activation: BFF for the whole call -->
      <rect x="316" y="172" width="8" height="428" fill="rgba(0,0,0,0.06)" stroke="#666666" stroke-width="0.8"/>
      <rect x="516" y="252" width="8" height="112" fill="rgba(0,0,0,0.06)" stroke="#666666" stroke-width="0.8"/>
      <rect x="716" y="388" width="8" height="40" fill="rgba(0,0,0,0.06)" stroke="#666666" stroke-width="0.8"/>
      <rect x="916" y="468" width="8" height="40" fill="rgba(0,0,0,0.06)" stroke="#666666" stroke-width="0.8"/>

      <!-- M1 Console → BFF -->
      <line x1="120" y1="176" x2="316" y2="176" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="144" y="160" width="152" height="12" rx="2" fill="#f7f7ff"/>
      <text x="220" y="170" fill="#009634" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST REGISTRATIONS</text>

      <!-- self: mapping PENDING -->
      <path d="M324,200 H348 Q356,200 356,208 V212 Q356,220 348,220 H332" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="368" y="204" width="128" height="12" rx="2" fill="#f7f7ff"/>
      <text x="432" y="213" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MAPPING → PENDING</text>

      <!-- M2 BFF → Drive metadata -->
      <line x1="324" y1="256" x2="516" y2="256" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="360" y="240" width="120" height="12" rx="2" fill="#f7f7ff"/>
      <text x="420" y="250" fill="#009634" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET FILE METADATA</text>

      <!-- M3 Drive → BFF -->
      <line x1="516" y1="288" x2="328" y2="288" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="352" y="272" width="136" height="12" rx="2" fill="#f7f7ff"/>
      <text x="420" y="282" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">META · SHORTCUT RESOLVED</text>

      <!-- M4 BFF → Drive download -->
      <line x1="324" y1="328" x2="516" y2="328" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="352" y="312" width="136" height="12" rx="2" fill="#f7f7ff"/>
      <text x="420" y="322" fill="#009634" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET MEDIA / EXPORT</text>

      <!-- M5 Drive → BFF stream -->
      <line x1="516" y1="360" x2="328" y2="360" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="392" y="344" width="56" height="12" rx="2" fill="#f7f7ff"/>
      <text x="420" y="354" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STREAM</text>

      <!-- M6 BFF → Store (accent: bytes first) -->
      <line x1="324" y1="392" x2="716" y2="392" stroke="#2736c8" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="432" y="376" width="176" height="12" rx="2" fill="#f7f7ff"/>
      <text x="520" y="386" fill="#2736c8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PIPE · HASH · SIZE CAP · RENAME</text>

      <!-- M7 Store → BFF -->
      <line x1="716" y1="424" x2="328" y2="424" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="472" y="408" width="96" height="12" rx="2" fill="#f7f7ff"/>
      <text x="520" y="418" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SHA256 · SIZE</text>

      <!-- M8 BFF → MILS -->
      <line x1="324" y1="472" x2="916" y2="472" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="524" y="456" width="192" height="12" rx="2" fill="#f7f7ff"/>
      <text x="620" y="466" fill="#009634" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /ITEMS {ITEMTYPEID, OBJECTID}</text>

      <!-- M9 MILS → BFF -->
      <line x1="916" y1="504" x2="328" y2="504" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="592" y="488" width="56" height="12" rx="2" fill="#f7f7ff"/>
      <text x="620" y="498" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ITEMID</text>

      <!-- self: REGISTERED + payload + log -->
      <path d="M324,536 H348 Q356,536 356,544 V548 Q356,556 348,556 H332" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="368" y="540" width="232" height="12" rx="2" fill="#f7f7ff"/>
      <text x="484" y="549" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGISTERED · LINK FILE · PAYLOAD · LOG</text>

      <!-- M10 BFF → Console -->
      <line x1="316" y1="592" x2="128" y2="592" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="136" y="576" width="168" height="12" rx="2" fill="#f7f7ff"/>
      <text x="220" y="586" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">{OUTCOME, MAPPING, FILE}</text>

      <!-- actors -->
      <rect x="48" y="72" width="144" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="48" y="72" width="144" height="56" rx="6" fill="rgba(102,102,102,0.10)" stroke="#999999" stroke-width="1"/>
      <rect x="56" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(153,153,153,0.40)" stroke-width="0.8"/>
      <text x="72" y="89" fill="#999999" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="120" y="104" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Console</text>
      <text x="120" y="119" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Drive browser</text>

      <rect x="248" y="72" width="144" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="248" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <rect x="256" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.40)" stroke-width="0.8"/>
      <text x="270" y="89" fill="rgba(0,0,0,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BFF</text>
      <text x="320" y="104" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">DriveRegistration</text>
      <text x="320" y="119" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">google-drive module</text>

      <rect x="448" y="72" width="144" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="448" y="72" width="144" height="56" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <rect x="456" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.30)" stroke-width="0.8"/>
      <text x="470" y="89" fill="rgba(0,0,0,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="520" y="104" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Google Drive</text>
      <text x="520" y="119" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Drive v3 · user token</text>

      <rect x="648" y="72" width="144" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="648" y="72" width="144" height="56" rx="6" fill="rgba(39,54,200,0.08)" stroke="#2736c8" stroke-width="1.2"/>
      <rect x="656" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(39,54,200,0.40)" stroke-width="0.8"/>
      <text x="674" y="89" fill="rgba(39,54,200,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
      <text x="720" y="104" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">File store</text>
      <text x="720" y="119" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FILE_STORE_DIR/aa/sha256</text>

      <rect x="848" y="72" width="144" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="848" y="72" width="144" height="56" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <rect x="856" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.30)" stroke-width="0.8"/>
      <text x="870" y="89" fill="rgba(0,0,0,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="920" y="104" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MILS</text>
      <text x="920" y="119" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/rest · minted JWT</text>

      <!-- legend -->
      <line x1="48" y1="648" x2="992" y2="648" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
      <text x="48" y="664" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <line x1="132" y1="684" x2="160" y2="684" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="168" y="688" fill="#666666" font-size="8" font-family="'Inter', sans-serif">HTTP call</text>
      <line x1="252" y1="684" x2="280" y2="684" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="288" y="688" fill="#666666" font-size="8" font-family="'Inter', sans-serif">Return</text>
      <line x1="356" y1="684" x2="384" y2="684" stroke="#2736c8" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="392" y="688" fill="#666666" font-size="8" font-family="'Inter', sans-serif">Bytes land locally before the MILS item exists</text>
      <rect x="668" y="678" width="12" height="12" rx="2" fill="rgba(39,54,200,0.08)" stroke="#2736c8" stroke-width="1"/>
      <text x="688" y="688" fill="#666666" font-size="8" font-family="'Inter', sans-serif">Focal: the serve-locally promise</text>
    </svg>
