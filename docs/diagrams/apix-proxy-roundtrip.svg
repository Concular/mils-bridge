<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apix-proxy-roundtrip-title apix-proxy-roundtrip-desc">
      <title id="apix-proxy-roundtrip-title">API Explorer — one request through the proxy</title>
      <desc id="apix-proxy-roundtrip-desc">Sequence diagram of a Scalar request through the BFF proxy: the target is checked against the API base URL and the private-range policy, headers are rebuilt and the stored credential injected, the request is forwarded without following redirects, the exchange is recorded with secrets redacted, and the response returns with an X-Bridge-Exchange-Id header.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2736c8"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#009634"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f7f7ff"/>

      <!-- lifelines: Scalar 160 · BFF 480 · Upstream 800 -->
      <line x1="160" y1="128" x2="160" y2="512" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="128" x2="480" y2="512" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="512" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <rect x="476" y="172" width="8" height="300" fill="rgba(0,0,0,0.06)" stroke="#666666" stroke-width="0.8"/>
      <rect x="796" y="316" width="8" height="48" fill="rgba(0,0,0,0.06)" stroke="#666666" stroke-width="0.8"/>

      <!-- M1 Scalar → BFF -->
      <line x1="160" y1="176" x2="476" y2="176" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="216" y="160" width="200" height="12" rx="2" fill="#f7f7ff"/>
      <text x="316" y="170" fill="#009634" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALL APIS/:ID/PROXY ?SCALAR_URL=</text>

      <!-- self 1: target guard -->
      <path d="M484,208 H508 Q516,208 516,216 V220 Q516,228 508,228 H492" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="212" width="216" height="12" rx="2" fill="#f7f7ff"/>
      <text x="636" y="221" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TARGETGUARD · UNDER BASE URL · NOT PRIVATE</text>

      <!-- self 2: headers + credential -->
      <path d="M484,256 H508 Q516,256 516,264 V268 Q516,276 508,276 H492" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="260" width="224" height="12" rx="2" fill="#f7f7ff"/>
      <text x="640" y="269" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DROP COOKIE/HOST/ORIGIN · INJECT CREDENTIAL</text>

      <!-- M2 BFF → Upstream -->
      <line x1="484" y1="320" x2="796" y2="320" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="548" y="304" width="184" height="12" rx="2" fill="#f7f7ff"/>
      <text x="640" y="314" fill="#009634" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD RAW BODY · MAXREDIRECTS 0</text>

      <!-- M3 Upstream → BFF -->
      <line x1="796" y1="360" x2="488" y2="360" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="564" y="344" width="152" height="12" rx="2" fill="#f7f7ff"/>
      <text x="640" y="354" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATUS · HEADERS · BODY</text>

      <!-- self 3: record exchange -->
      <path d="M484,392 H508 Q516,392 516,400 V404 Q516,412 508,412 H492" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="528" y="396" width="216" height="12" rx="2" fill="#f7f7ff"/>
      <text x="636" y="405" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECORD EXCHANGE · REDACT · CAP · PRUNE</text>

      <!-- M4 BFF → Scalar (headline) -->
      <line x1="476" y1="456" x2="168" y2="456" stroke="#2736c8" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="216" y="440" width="200" height="12" rx="2" fill="#f7f7ff"/>
      <text x="316" y="450" fill="#2736c8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE + X-BRIDGE-EXCHANGE-ID</text>

      <!-- actors -->
      <rect x="88" y="72" width="144" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="88" y="72" width="144" height="56" rx="6" fill="rgba(102,102,102,0.10)" stroke="#999999" stroke-width="1"/>
      <rect x="96" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(153,153,153,0.40)" stroke-width="0.8"/>
      <text x="112" y="89" fill="#999999" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="160" y="104" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Scalar client</text>
      <text x="160" y="119" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">credentials: include</text>

      <rect x="408" y="72" width="144" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="408" y="72" width="144" height="56" rx="6" fill="rgba(39,54,200,0.08)" stroke="#2736c8" stroke-width="1.2"/>
      <rect x="416" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(39,54,200,0.40)" stroke-width="0.8"/>
      <text x="430" y="89" fill="rgba(39,54,200,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BFF</text>
      <text x="480" y="104" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Per-API proxy</text>
      <text x="480" y="119" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ApiExplorerProxyService</text>

      <rect x="728" y="72" width="144" height="56" rx="6" fill="#f7f7ff"/>
      <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.30)" stroke-width="1"/>
      <rect x="736" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(0,0,0,0.30)" stroke-width="0.8"/>
      <text x="750" y="89" fill="rgba(0,0,0,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="800" y="104" fill="#000000" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Imported API</text>
      <text x="800" y="119" fill="#666666" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">under its base URL</text>

      <!-- legend -->
      <line x1="56" y1="536" x2="904" y2="536" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
      <text x="56" y="552" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <line x1="140" y1="572" x2="168" y2="572" stroke="#009634" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="176" y="576" fill="#666666" font-size="8" font-family="'Inter', sans-serif">HTTP call</text>
      <line x1="260" y1="572" x2="288" y2="572" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="296" y="576" fill="#666666" font-size="8" font-family="'Inter', sans-serif">Return</text>
      <line x1="368" y1="572" x2="396" y2="572" stroke="#2736c8" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="404" y="576" fill="#666666" font-size="8" font-family="'Inter', sans-serif">Headline: the recorded exchange id</text>
      <line x1="620" y1="572" x2="648" y2="572" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="656" y="576" fill="#666666" font-size="8" font-family="'Inter', sans-serif">Work inside the BFF (self-message)</text>
    </svg>
