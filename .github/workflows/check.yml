# Does the published compose file still start the published image?
#
# This repository has no source to compile — what it can get wrong is a compose
# file that references a tag nobody published, an env variable the image no
# longer reads, or a quickstart that no longer reaches /setup. So the check is
# to run it.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because `latest` moves underneath this file even when nothing here
  # changes: a release that breaks the published compose file should be found
  # by us and not by someone cloning the repo.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A throwaway .env
        run: |
          cp .env.example .env
          printf '\nMILS_ACTOR_CODE_SELF=ci\n' >> .env

      - name: The compose file parses
        run: docker compose config -q

      # Only meaningful once an image has actually been published; until then
      # the pull fails and says so, which is the honest signal.
      - name: Start it
        run: docker compose up -d --wait --wait-timeout 180

      - name: It is alive, and says which release it is
        run: |
          curl -fsS http://localhost:8080/api/health/live
          curl -fsS http://localhost:8080/api/version
          # The first visit must offer first-run setup, not a login wall.
          curl -fsS http://localhost:8080/api/auth/setup | grep -q needsSetup
          # The console is served from the same origin...
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200
          # ...without the SPA fallback swallowing the path peer nodes call.
          # The status does not matter (this request names no ItemTypeId, so a
          # complaint is the correct answer) — being answered in JSON rather
          # than in HTML is the whole point.
          type=$(curl -s -o /dev/null -w '%{content_type}' http://localhost:8080/rest/MilsItems)
          case "$type" in application/json*) ;; *) echo "peer path answered $type"; exit 1 ;; esac

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v
