name: Question
description: How do I…? Is this supposed to…?
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        `docs/troubleshooting.md` is organised symptom first, and
        `docs/configuration.md` lists every setting with its default — those two
        answer most questions faster than we can.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and where you got stuck.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: '0.1.0'

  - type: textarea
    id: tried
    attributes:
      label: What you have already tried
      description: >-
        Including anything in the documentation that looked like it should have
        covered it — a page that failed to answer a fair question is itself
        worth fixing.
